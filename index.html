<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather App</h1>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >
            <button onclick="getWeather()">Search</button>
        </div>

        <p id="error"></p>

        <div id="weather" class="weather-card">

            <h2 id="city">Search for a city</h2>

            <div class="weather-icon" id="weatherIcon">🌤️</div>

            <h3 id="temperature">--°C</h3>

            <p id="description">Weather information will appear here</p>

            <div class="details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feels">--°C</strong>
                </div>

            </div>

        </div>

        <h2 class="forecast-title">5-Day Forecast</h2>

        <div id="forecast" class="forecast-container"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
